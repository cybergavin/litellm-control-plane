---
# Each production service account receives one OpenTofu-managed workload key
# tied to its team. LiteLLM stores the generated key via its configured
# virtual-key backend (e.g. AWS Secrets Manager).
#
# Human users are NOT defined here. They are provisioned automatically by
# your Identity Provider via SSO JIT provisioning or SCIM sync.
# See docs/USER_PROVISIONING.md.
service_accounts:
  svc-platform-app:
    user_alias: "Platform Application"
    team: "engineering-platform"
  svc-research-pipeline:
    user_alias: "Research Pipeline"
    team: "data-science-research"
