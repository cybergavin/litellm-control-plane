---
# Staging is a non-production environment. Users get internal_user role and
# all-proxy-models access by default. No budget enforcement, tags, or
# read-only permission restrictions are applied here.
prod_environment: "prod"
user_email_domain: "example.com"

# EXAMPLE: adopting models that already exist in LiteLLM (commented out).
# Pairs with the commented examples in models.yaml; the keys must match.
# Find each ID in the LiteLLM UI (model details) or via GET /model/info
# (model_info.id). Merge this together with the models.yaml entries in one PR,
# apply once, then delete these entries and keep the empty map. Entries belong
# only in the global.yaml of the environment where the models actually exist.
# An entry whose key is missing from models.yaml fails the plan.
#
# model_imports:
#   anthropic-claude-sonnet: "11111111-1111-1111-1111-111111111111"  # managed
#   google-gemini-flash: "22222222-2222-2222-2222-222222222222"      # preserved
