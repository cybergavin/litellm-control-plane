---
$schema: "https://json-schema.org/draft/2020-12/schema"
type: object
required:
  - service_accounts
properties:
  service_accounts:
    type: object
    description: Non-interactive LiteLLM identities keyed by their stable user ID.
    propertyNames:
      pattern: "^svc-[a-z0-9][a-z0-9-]*$"
    additionalProperties:
      type: object
      required:
        - user_alias
        - team
      properties:
        user_alias:
          type: string
          minLength: 1
        team:
          type: string
          description: Workload team that owns the generated service-account key.
          pattern: "^[a-z0-9][a-z0-9-]*$"
      additionalProperties: false
additionalProperties: false
